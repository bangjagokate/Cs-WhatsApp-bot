<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanifa Laundry CS Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="h-[100dvh] bg-slate-950 text-slate-100 flex flex-col font-sans overflow-hidden">
  <header class="h-14 bg-slate-900 border-b border-slate-800 px-4 flex justify-between items-center">
    <h1 class="text-sm font-bold text-white">Hanifa Laundry CS Engine</h1>
    <button onclick="openQrModal()" id="statusBadge" class="px-3 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-xl text-xs font-bold flex items-center gap-1.5">
      <i class="fas fa-qrcode"></i> <span id="statusBadgeText">Scan QR WA</span>
    </button>
  </header>

  <main class="flex-1 flex overflow-hidden">
    <aside class="w-80 bg-slate-900 border-r border-slate-800 p-3">
      <div id="contactList" class="space-y-2"></div>
    </aside>
    <section class="flex-1 bg-slate-950 p-4 flex flex-col justify-between">
      <div id="messageList" class="flex-1 overflow-y-auto space-y-2"></div>
      <div class="flex gap-2">
        <input type="text" id="msgInput" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" placeholder="Ketik pesan CS...">
        <button id="sendBtn" class="bg-emerald-600 px-4 py-2 rounded-xl text-xs font-bold">Kirim</button>
      </div>
    </section>
  </main>

  <!-- Modal QR -->
  <div id="qrModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4 text-center relative">
      <button onclick="closeQrModal()" class="absolute top-3 right-3 text-slate-400">✕</button>
      <h3 class="text-sm font-bold text-white">Scan QR Code WhatsApp</h3>
      
      <div class="bg-white p-4 rounded-xl flex items-center justify-center min-h-[200px]" id="qrCanvasContainer">
        <!-- Canvas QR dirender di sini -->
        <div id="qrcode"></div>
        <div id="qrLoader" class="text-slate-600 text-xs">Menunggu data dari Termux...</div>
        <div id="qrConnectedCheck" class="hidden text-emerald-600 font-bold text-sm">✅ WA Terhubung!</div>
      </div>
      
      <p id="qrDeviceStatusText" class="text-xs text-amber-400">Status: Polling Data...</p>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
