<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hanifa Laundry CS Panel - Vercel Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="h-[100dvh] w-screen bg-slate-950 text-slate-100 flex flex-col font-sans overflow-hidden">

  <header class="h-14 bg-slate-900 border-b border-slate-800 px-4 flex justify-between items-center shrink-0">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
        <i class="fab fa-whatsapp text-lg"></i>
      </div>
      <div>
        <h1 class="text-xs sm:text-sm font-bold text-white">Hanifa Laundry CS</h1>
        <p class="text-[10px] text-emerald-400 font-mono flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Vercel Anti-Sleep Active
        </p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button id="enableNotifBtn" class="px-3 py-1 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-full text-xs font-semibold flex items-center gap-1.5 hover:bg-blue-600/30 transition">
        <i class="fas fa-bell"></i> <span>Aktifkan Notifikasi OS</span>
      </button>
    </div>
  </header>

  <main class="flex-1 flex overflow-hidden">
    <aside class="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col">
      <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
        <span class="text-xs font-bold uppercase text-slate-400">Daftar Kontak CS</span>
        <button onclick="loadContacts()" class="text-emerald-400 text-xs hover:underline"><i class="fas fa-sync"></i> Sync</button>
      </div>
      <div id="contactList" class="flex-1 overflow-y-auto divide-y divide-slate-800"></div>
    </aside>

    <section class="flex-1 flex flex-col bg-slate-950">
      <div id="chatHeader" class="p-3 border-b border-slate-800 bg-slate-900 flex justify-between items-center">
        <div>
          <h2 id="activeChatName" class="font-bold text-xs text-white">Pilih Percakapan</h2>
          <span id="activeJid" class="text-[10px] text-slate-400 font-mono">JID</span>
        </div>
        <select id="modeToggle" class="bg-slate-950 border border-slate-700 text-xs rounded-xl px-2 py-1 text-white">
          <option value="bot">🤖 Auto Bot</option>
          <option value="human">👤 CS Admin (Human)</option>
        </select>
      </div>

      <div id="messageList" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="h-full flex flex-col items-center justify-center text-slate-500 space-y-2">
          <i class="fab fa-whatsapp text-4xl text-slate-700"></i>
          <p class="text-xs">Pilih percakapan untuk merespons pelanggan.</p>
        </div>
      </div>

      <div class="p-3 bg-slate-900 border-t border-slate-800 flex gap-2">
        <input type="text" id="msgInput" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white" placeholder="Ketik balasan CS Admin...">
        <button id="sendBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Kirim</button>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
