<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hanifa Laundry CS Panel - Meta Cloud API Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .wa-bg { background-color: #0b141a; background-image: radial-gradient(#1e293b 1px, transparent 0); background-size: 14px 14px; }
  </style>
</head>
<body class="h-[100dvh] w-screen bg-slate-950 text-slate-100 flex flex-col font-sans overflow-hidden">

  <!-- Header Navigation -->
  <header class="h-14 bg-slate-900 border-b border-slate-800 px-4 flex justify-between items-center shrink-0 z-30">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
        <i class="fab fa-whatsapp text-lg"></i>
      </div>
      <div>
        <h1 class="text-xs sm:text-sm font-bold text-white tracking-wide">Hanifa Laundry CS</h1>
        <p class="text-[10px] text-emerald-400 font-mono flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Meta Cloud API (Termux Free)
        </p>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 flex overflow-hidden relative">
    <aside class="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col">
      <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">DAFTAR KONTAK CS</span>
        <button onclick="loadContacts()" class="text-emerald-400 text-xs hover:text-emerald-300 flex items-center gap-1">
          <i class="fas fa-sync"></i> Refresh
        </button>
      </div>
      <div id="contactList" class="flex-1 overflow-y-auto divide-y divide-slate-800/60"></div>
    </aside>

    <section class="flex-1 flex flex-col bg-slate-950 w-full h-full wa-bg relative">
      <div class="px-4 py-2.5 border-b border-slate-800 bg-slate-900/90 backdrop-blur flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-xs" id="avatarLetter">C</div>
          <div>
            <h2 id="activeChatName" class="font-bold text-xs text-white">Pilih Kontak</h2>
            <span id="activeJid" class="text-[10px] text-slate-400 font-mono block">JID</span>
          </div>
        </div>

        <select id="modeToggle" class="bg-slate-950 border border-slate-700 text-xs rounded-xl px-2 py-1 text-white">
          <option value="bot">🤖 Auto Bot</option>
          <option value="human">👤 CS Admin (Human)</option>
        </select>
      </div>

      <div id="messageList" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div id="emptyChatPlaceholder" class="h-full flex flex-col items-center justify-center text-slate-500 space-y-2">
          <i class="fab fa-whatsapp text-4xl text-slate-700"></i>
          <p class="text-xs">Pilih percakapan di sebelah kiri untuk mulai merespons.</p>
        </div>
      </div>

      <div class="p-3 bg-slate-900 border-t border-slate-800 flex gap-2 shrink-0">
        <input type="text" id="msgInput" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white" placeholder="Ketik balasan CS...">
        <button id="sendBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Kirim</button>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
