<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hanifa Laundry CS Panel & QR Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .wa-bg { background-color: #0b141a; background-image: radial-gradient(#1e293b 1px, transparent 0); background-size: 14px 14px; }
  </style>
</head>
<body class="h-[100dvh] w-screen bg-slate-950 text-slate-100 flex flex-col font-sans overflow-hidden">

  <!-- Header Navigation -->
  <header class="h-14 bg-slate-900 border-b border-slate-800 px-3 sm:px-4 flex justify-between items-center shrink-0 z-30">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
        <i class="fab fa-whatsapp text-lg"></i>
      </div>
      <div>
        <h1 class="text-xs sm:text-sm font-bold text-white tracking-wide">Hanifa Laundry CS</h1>
        <p class="text-[10px] text-slate-400">Cloud API Remote Engine</p>
      </div>
    </div>

    <!-- Tombol Scan QR Device -->
    <div class="flex items-center space-x-2">
      <button onclick="openQrModal()" id="statusBadge" class="px-3 py-1.5 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-xl text-xs font-bold flex items-center gap-1.5 hover:bg-amber-500/30 transition cursor-pointer shadow-lg">
        <i class="fas fa-qrcode text-amber-400"></i>
        <span id="statusBadgeText">Scan QR WA</span>
      </button>

      <button id="enableNotifBtn" class="px-2.5 py-1.5 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-xl text-xs font-semibold flex items-center gap-1.5 hover:bg-blue-600/30 transition">
        <i class="fas fa-bell"></i> <span class="hidden sm:inline">Notifikasi OS</span>
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 flex overflow-hidden relative">
    <aside id="sidebar" class="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col">
      <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">DAFTAR KONTAK CS</span>
        <button onclick="loadContacts()" class="text-emerald-400 text-xs hover:text-emerald-300 flex items-center gap-1">
          <i class="fas fa-sync"></i> Refresh
        </button>
      </div>
      <div id="contactList" class="flex-1 overflow-y-auto divide-y divide-slate-800/60"></div>
    </aside>

    <section id="chatPanel" class="flex-1 flex flex-col bg-slate-950 w-full h-full wa-bg relative">
      <div id="chatHeader" class="px-3 sm:px-4 py-2.5 border-b border-slate-800 bg-slate-900/90 backdrop-blur flex justify-between items-center shrink-0 z-10">
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-xs" id="avatarLetter">C</div>
          <div>
            <h2 id="activeChatName" class="font-bold text-xs text-white">Pilih Kontak</h2>
            <span id="activeJid" class="text-[10px] text-slate-400 font-mono block">JID</span>
          </div>
        </div>

        <div class="flex items-center space-x-2">
          <select id="modeToggle" class="bg-slate-950 border border-slate-700 text-xs rounded-xl px-2 py-1 text-white focus:outline-none focus:border-emerald-500">
            <option value="bot">🤖 Auto Bot</option>
            <option value="human">👤 CS Admin (Human)</option>
          </select>
        </div>
      </div>

      <div id="messageList" class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-3">
        <div id="emptyChatPlaceholder" class="h-full flex flex-col items-center justify-center text-slate-500 space-y-2">
          <i class="fab fa-whatsapp text-4xl text-slate-700"></i>
          <p class="text-xs">Pilih percakapan di sebelah kiri untuk mulai merespons.</p>
        </div>
      </div>

      <div id="inputArea" class="p-2.5 sm:p-3 bg-slate-900 border-t border-slate-800 flex gap-2 shrink-0">
        <input type="text" id="msgInput" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500" placeholder="Ketik balasan CS...">
        <button id="sendBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1">
          <i class="fas fa-paper-plane"></i>
          <span>Kirim</span>
        </button>
      </div>
    </section>
  </main>

  <!-- MODAL WINDOW LOGIN SCAN QR CODE WHATSAPP -->
  <div id="qrModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl relative text-center">
      <button onclick="closeQrModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white p-1 text-sm">
        <i class="fas fa-times"></i>
      </button>

      <div class="space-y-1">
        <h3 class="text-sm font-bold text-white flex items-center justify-center gap-2">
          <i class="fas fa-qrcode text-emerald-400 text-lg"></i> Scan QR Code WhatsApp
        </h3>
        <p class="text-xs text-slate-400">Buka WA HP > Perangkat Tertaut > Tautkan Perangkat</p>
      </div>

      <div class="bg-white p-3 rounded-2xl border border-slate-700 flex items-center justify-center min-h-[200px] relative shadow-inner">
        <img id="qrImage" class="w-48 h-48 object-contain rounded-lg hidden">
        <div id="qrConnectedCheck" class="hidden flex flex-col items-center justify-center text-emerald-600 space-y-2">
          <i class="fas fa-check-circle text-5xl"></i>
          <span class="text-xs font-bold text-slate-800">WhatsApp Terhubung!</span>
        </div>
        <div id="qrLoader" class="text-slate-600 text-xs font-medium flex flex-col items-center gap-2">
          <i class="fas fa-spinner fa-spin text-2xl text-emerald-600"></i>
          <span>Menghubungkan ke Engine WA...</span>
        </div>
      </div>

      <div id="qrDeviceStatusText" class="text-xs font-semibold text-amber-400">
        Status: Menunggu Scan QR Code...
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
